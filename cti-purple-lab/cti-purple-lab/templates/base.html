<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTI Purple Security Lab</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav><a class="brand" href="/">🟣 CTI Purple Lab</a>
{% if session.user_id %}<a href="/challenges">Desafios</a>
{% if session.role == 'mentor' %}<a href="/dashboard">Dashboard</a><a href="/ambientes">Ambientes</a>{% endif %}
<span class="right">{{ session.name }} · <a href="/logout">Sair</a></span>
{% else %}<a class="right" href="/login">Entrar</a><a href="/register">Cadastrar</a>{% endif %}</nav>
<main>{% for m in get_flashed_messages() %}<p class="msg">{{ m }}</p>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
